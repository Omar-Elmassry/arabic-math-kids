<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دروس رياضيات للأطفال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#4A2C1D;--muted:#8A6A55;--pink:#F25C7A;--pink-d:#C93D5C;--edge:#F1DCC2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,Arial,sans-serif;font-size:19px;
  background:radial-gradient(circle at 12px 12px,rgba(242,92,122,.10) 3px,transparent 4px) 0 0/36px 36px,linear-gradient(#FFF4E4,#FFE7D1)}
.wrap{max-width:720px;margin:0 auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0;font-size:36px;color:var(--pink-d);text-align:center;text-wrap:balance}
p.sub{margin:4px 0 28px;text-align:center;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:16px}
a.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:#fff;border-radius:26px;padding:14px 16px;
  box-shadow:0 6px 0 var(--edge),0 10px 22px rgba(107,62,38,.10);transition:transform .1s}
a.card:active{transform:translateY(4px)}
a.card:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
.ic{flex:none;width:72px;height:72px;border-radius:22px;background:#FFE7C2;display:grid;place-items:center}
.ic svg{width:52px;height:52px}
.t{flex:1;min-width:0;line-height:1.35}
.t b{display:block;font-size:23px}
.t small{color:var(--muted);font-weight:600;font-size:16px}
.go{font-size:26px;color:var(--pink)}
.soon{text-align:center;color:var(--muted);margin-top:26px;font-size:16px}
</style>
</head>
<body>
<main class="wrap">
  <h1>دروس رياضيات للأطفال</h1>
  <p class="sub">دروس تفاعلية بالعربي — العب وتعلّم</p>
  <div class="list">
    <a class="card" href="division-remainder/">
      <span class="ic"><svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#E9A856" stroke="#C98235" stroke-width="2"/>
        <circle cx="17" cy="16" r="11" fill="#F4C27A" opacity=".55"/>
        <ellipse cx="13" cy="14" rx="2.8" ry="2.3" fill="#5A321C"/><ellipse cx="25" cy="11.5" rx="2.4" ry="2" fill="#5A321C"/>
        <ellipse cx="28" cy="23" rx="2.8" ry="2.3" fill="#5A321C"/><ellipse cx="15" cy="27" rx="2.5" ry="2.1" fill="#5A321C"/>
        <ellipse cx="21" cy="20" rx="2" ry="1.7" fill="#5A321C"/></svg></span>
      <span class="t"><b>مخبز بوبو: القسمة مع الباقي</b><small>نوزّع الكعك، نقفز مع الأرنب، جدول الضرب، طلبات الزبائن، ولعبة الفقاعات</small></span>
      <span class="go" aria-hidden="true">◀</span>
    </a>
  </div>
  <p class="soon">دروس أخرى قريبًا ✨</p>
</main>
</body>
</html>
